<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Оставить заявку — БазМет</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css?v=2">
</head>
<body>
<header class="container py-3">
<nav class="navbar navbar-expand-lg navbar-bazmet rounded-pill">
<div class="container-fluid">
<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Меню">
<span class="navbar-toggler-icon"></span>
</button>
<div class="collapse navbar-collapse" id="mainNav">
<ul class="navbar-nav w-100 justify-content-evenly">
<li class="nav-item"><a class="nav-link" href="index.html">Главная</a></li>
<li class="nav-item"><a class="nav-link" href="catalog.html">Каталог</a></li>
<li class="nav-item"><a class="nav-link active" href="services.html" aria-current="page">Услуги</a></li>
<li class="nav-item"><a class="nav-link" href="about.html">О компании</a></li>
<li class="nav-item"><a class="nav-link" href="contacts.html">Контакты</a></li>
</ul>
</div>
</div>
</nav>
</header>
<main class="page container pb-5">

<h1 class="mb-4">Оставить заявку</h1>
<form class="form-sage p-4 p-md-5" action="order.html" method="post">
<div class="mb-3">
<label class="form-label" for="service">Услуга</label>
<input class="form-control form-control-lg rounded-pill" type="text" id="service" name="service" placeholder="Например: Лазерная гравировка">
</div>
<div class="mb-3">
<label class="form-label" for="name">Ваше имя *</label>
<input class="form-control form-control-lg rounded-pill" type="text" id="name" name="name" placeholder="Введите имя" required>
</div>
<div class="mb-3">
<label class="form-label" for="phone">Номер телефона *</label>
<input class="form-control form-control-lg rounded-pill" type="tel" id="phone" name="phone" placeholder="+7 (___) ___ - __ - __" required>
</div>
<div class="mb-3">
<label class="form-label" for="email">E-mail *</label>
<input class="form-control form-control-lg rounded-pill" type="email" id="email" name="email" placeholder="example@mail.ru" required>
</div>
<div class="mb-4">
<label class="form-label" for="description">Описание / Спецификация заявки</label>
<textarea class="form-control" id="description" name="description" rows="5" placeholder="Укажите количество, размеры и дополнительные требования"></textarea>
</div>
<div class="text-center">
<button class="btn btn-gold btn-lg rounded-pill px-5" type="submit">Отправить заявку</button>
</div>
</form>

</main>

<footer class="site-footer text-center py-4">
<p class="mb-0">&copy; 2026 ООО «БазМет»</p>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
(function () {
  var params = new URLSearchParams(window.location.search);
  var service = params.get("service");
  if (!service) return;
  var field = document.getElementById("service");
  if (field && !field.value) field.value = service;
})();
</script>

</body>
</html>
